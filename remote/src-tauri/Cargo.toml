[package]
name = "onion-remote"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "io-util", "fs", "net", "time", "macros"] }
russh = { version = "0.64", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "3"
flate2 = "1"
png = "0.18"

[profile.release]
strip = true
lto = true
